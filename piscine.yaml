substitutions:
  system_name: pool
  friendly_name: "Pool"
  device_description: "Controls pool pump and treatment"

esphome:
  on_boot:
    - priority: -100
      then:
        - if:
            condition:
              or:
                - switch.is_on: pump_speed1
                - switch.is_on: pump_speed2
                - switch.is_on: pump_speed3
            then:
              - switch.turn_on: relais_traitement
    - priority: -101
      then:
        - lambda: |-
            ESP_LOGD("Boot", "pump_off=%d speed1=%d speed2=%d speed3=%d",
              id(pump_off).state, id(pump_speed1).state, id(pump_speed2).state, id(pump_speed3).state);
        - wait_until:
            condition:
              api.connected:
                state_subscription_only: True
            timeout: 30s
        - homeassistant.action:
            action: notify.notify
            data:
              title: Piscine
            data_template:
              message: |-
                Le contrôleur vient de démarrer.
                Pompe : {{ pump_state }}.
                Traitement : {{ traitement_state }}.
            variables:
              pump_state: |-
                if (id(pump_speed1).state) return std::string("Vitesse 1");
                if (id(pump_speed2).state) return std::string("Vitesse 2");
                if (id(pump_speed3).state) return std::string("Vitesse 3");
                return std::string("Arrêt");
              traitement_state: |-
                if (id(relais_traitement).state) {
                  return "On";
                } else {
                  return "Off";
                }

esp32:
  variant: esp32s3
  framework:
    type: esp-idf
  
packages:
  restart: !include commons/restart.yaml
  device: !include commons/device.yaml
  wifi: !include
    file: commons/wifi.yaml
    vars:
      ip: 192.168.1.103
  api: !include commons/api.yaml
  logger: !include commons/logger.yaml

switch:
  - platform: gpio
    id: pump_off
    internal: true
    pin: 4
    restore_mode: RESTORE_DEFAULT_ON
    interlock: &pump_interlock [pump_off, pump_speed1, pump_speed2, pump_speed3]
    on_turn_on:
      - component.update: pump_select
      - switch.turn_off: relais_traitement

  - platform: gpio
    id: pump_speed3
    internal: true
    pin: 5
    restore_mode: RESTORE_DEFAULT_OFF
    interlock: *pump_interlock
    interlock_wait_time: 200ms
    on_turn_on:
      - component.update: pump_select
      - switch.turn_on: relais_traitement

  - platform: gpio
    id: pump_speed2
    internal: true
    pin: 6
    restore_mode: RESTORE_DEFAULT_OFF
    interlock: *pump_interlock
    interlock_wait_time: 200ms
    on_turn_on:
      - component.update: pump_select
      - switch.turn_on: relais_traitement

  - platform: gpio
    id: pump_speed1
    internal: true
    pin: 7
    restore_mode: RESTORE_DEFAULT_OFF
    interlock: *pump_interlock
    interlock_wait_time: 200ms
    on_turn_on:
      - component.update: pump_select
      - switch.turn_on: relais_traitement

  - platform: gpio
    id: relais_traitement
    name: "Traitement"
    pin:
      number: 1
      inverted: true
    on_turn_on:
      - if:
          condition:
            and:
              - switch.is_off: pump_speed1
              - switch.is_off: pump_speed2
              - switch.is_off: pump_speed3
          then:
            - switch.turn_off: relais_traitement

select:
  - platform: template
    name: "Pompe"
    id: pump_select
    options:
      - "Arrêt"
      - "Vitesse 1"
      - "Vitesse 2"
      - "Vitesse 3"
    lambda: |-
      ESP_LOGD("pump", "pump_off=%d speed1=%d speed2=%d speed3=%d",
        id(pump_off).state, id(pump_speed1).state, id(pump_speed2).state, id(pump_speed3).state);
      if (id(pump_speed1).state) return std::string("Vitesse 1");
      if (id(pump_speed2).state) return std::string("Vitesse 2");
      if (id(pump_speed3).state) return std::string("Vitesse 3");
      return std::string("Arrêt");
    update_interval: 10s
    set_action:
      - lambda: |-
          ESP_LOGD("pump", "set_action: %s", x.c_str());
          if (x == "Arrêt")          id(pump_off).turn_on();
          else if (x == "Vitesse 1") id(pump_speed1).turn_on();
          else if (x == "Vitesse 2") id(pump_speed2).turn_on();
          else if (x == "Vitesse 3") id(pump_speed3).turn_on();

one_wire:
  - platform: gpio
    pin: 16

sensor:
  - platform: dallas_temp
    name: "Température Eau"
    accuracy_decimals: 1
    update_interval: 60s

  - platform: dht
    model: DHT22
    pin: 15
    temperature:
      name: "Température extérieure"
      accuracy_decimals: 1
    humidity:
      name: "Humidité extérieure"
      accuracy_decimals: 1
    update_interval: 60s
    

