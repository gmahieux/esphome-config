substitutions:
  system_name: pool
  friendly_name: "Pool"
  device_description: "Controls pool pump and treatment"

esphome:
  on_boot:
    - priority: -100
      then:
        - if:
            condition:
              or:
                - switch.is_on: pump_speed1
                - switch.is_on: pump_speed2
                - switch.is_on: pump_speed3
            then:
              - switch.turn_on: relais_traitement

esp32:
  variant: esp32s3
  framework:
    type: esp-idf
  
globals:
  - id: traitement_delay_remaining
    type: int
    restore_value: no
    initial_value: '0'
  - id: runtime_speed1_min
    type: int
    restore_value: yes
    initial_value: '0'
  - id: runtime_speed2_min
    type: int
    restore_value: yes
    initial_value: '0'
  - id: runtime_speed3_min
    type: int
    restore_value: yes
    initial_value: '0'

packages:
  restart: !include commons/restart.yaml
  device: !include commons/device.yaml
  wifi: !include
    file: commons/wifi.yaml
    vars:
      ip: 192.168.1.103
  api: !include commons/api.yaml
  logger: !include commons/logger.yaml
  startup_notification: !include
    file: commons/startup_notification.yaml
    vars:
      notification_title: Piscine
      status_lambda: |-
        std::string s = "Pompe : ";
        if (id(pump_speed1).state)        s += "Vitesse 1.";
        else if (id(pump_speed2).state)   s += "Vitesse 2.";
        else if (id(pump_speed3).state)   s += "Vitesse 3.";
        else                              s += "Arrêt.";
        s += std::string("\nTraitement : ") + (id(relais_traitement).state ? "On" : "Off") + ".";
        return s;

switch:
  - platform: gpio
    id: pump_off
    internal: true
    pin: 4
    restore_mode: RESTORE_DEFAULT_ON
    interlock: &pump_interlock [pump_off, pump_speed1, pump_speed2, pump_speed3]
    on_turn_on:
      - component.update: pump_select
      - script.stop: start_traitement_delay
      - lambda: 'id(traitement_delay_remaining) = 0;'
      - switch.turn_off: relais_traitement
    on_turn_off:
      - script.execute: start_traitement_delay

  - platform: gpio
    id: pump_speed3
    internal: true
    pin: 5
    restore_mode: RESTORE_DEFAULT_OFF
    interlock: *pump_interlock
    interlock_wait_time: 200ms
    on_turn_on:
      - component.update: pump_select

  - platform: gpio
    id: pump_speed2
    internal: true
    pin: 6
    restore_mode: RESTORE_DEFAULT_OFF
    interlock: *pump_interlock
    interlock_wait_time: 200ms
    on_turn_on:
      - component.update: pump_select

  - platform: gpio
    id: pump_speed1
    internal: true
    pin: 7
    restore_mode: RESTORE_DEFAULT_OFF
    interlock: *pump_interlock
    interlock_wait_time: 200ms
    on_turn_on:
      - component.update: pump_select

  - platform: template
    name: "Autostart"
    id: autostart_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

  - platform: template
    name: "Autostop"
    id: autostop_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

  - platform: gpio
    id: relais_traitement
    name: "Traitement"
    pin:
      number: 1
      inverted: true
    on_turn_on:
      - script.stop: start_traitement_delay
      - lambda: 'id(traitement_delay_remaining) = 0;'
      - if:
          condition:
            and:
              - switch.is_off: pump_speed1
              - switch.is_off: pump_speed2
              - switch.is_off: pump_speed3
          then:
            - switch.turn_off: relais_traitement

select:
  - platform: template
    name: "Pompe"
    id: pump_select
    options:
      - "Arrêt"
      - "Vitesse 1"
      - "Vitesse 2"
      - "Vitesse 3"
    lambda: |-
      ESP_LOGD("pump", "pump_off=%d speed1=%d speed2=%d speed3=%d",
        id(pump_off).state, id(pump_speed1).state, id(pump_speed2).state, id(pump_speed3).state);
      if (id(pump_speed1).state) return std::string("Vitesse 1");
      if (id(pump_speed2).state) return std::string("Vitesse 2");
      if (id(pump_speed3).state) return std::string("Vitesse 3");
      return std::string("Arrêt");
    update_interval: 10s
    set_action:
      - lambda: |-
          ESP_LOGD("pump", "set_action: %s", x.c_str());
          if (x == "Arrêt")          id(pump_off).turn_on();
          else if (x == "Vitesse 1") id(pump_speed1).turn_on();
          else if (x == "Vitesse 2") id(pump_speed2).turn_on();
          else if (x == "Vitesse 3") id(pump_speed3).turn_on();

number:
  - platform: template
    name: "Delai avant Traitement (minutes)"
    id: traitement_delay_minutes
    optimistic: true
    restore_value: true
    initial_value: 5
    min_value: 0
    max_value: 10
    step: 1
    mode: slider
    unit_of_measurement: "min"
    entity_category: "config"

  - platform: template
    name: "Durée de filtration maximum"
    id: filtration_max_hours
    optimistic: true
    restore_value: true
    initial_value: 12
    min_value: 1
    max_value: 24
    step: 0.5
    mode: box
    unit_of_measurement: "h"
    entity_category: "config"

script:
  - id: start_traitement_delay
    mode: single
    then:
      - lambda: 'id(traitement_delay_remaining) = (int) (id(traitement_delay_minutes).state * 60);'
      - while:
          condition:
            lambda: 'return id(traitement_delay_remaining) > 0;'
          then:
            - delay: 1s
            - lambda: 'id(traitement_delay_remaining) -= 1;'
      - switch.turn_on: relais_traitement

datetime:
  - platform: template
    name: "Heure de démarrage"
    id: autostart_time
    type: time
    optimistic: true
    restore_value: true
    initial_value: "08:00:00"
    entity_category: config

  - platform: template
    name: "Heure de remise à zéro"
    id: runtime_reset_time
    type: time
    optimistic: true
    restore_value: true
    initial_value: "00:00:00"
    entity_category: config

time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        minutes: '*'
        then:
          - lambda: |-
              auto now = id(ha_time).now();
              if (now.hour == id(runtime_reset_time).hour
                  && now.minute == id(runtime_reset_time).minute) {
                id(runtime_speed1_min) = 0;
                id(runtime_speed2_min) = 0;
                id(runtime_speed3_min) = 0;
              }
              if (id(pump_speed1).state) id(runtime_speed1_min) += 1;
              else if (id(pump_speed2).state) id(runtime_speed2_min) += 1;
              else if (id(pump_speed3).state) id(runtime_speed3_min) += 1;
          - component.update: filtration_total_min
          - component.update: filtration_target_min
          - component.update: filtration_remaining_min
          - if:
              condition:
                and:
                  - switch.is_on: autostop_enabled
                  - switch.is_off: pump_off
                  - binary_sensor.is_on: filtration_quota_reached
              then:
                - switch.turn_on: pump_off
          - if:
              condition:
                and:
                  - switch.is_on: autostart_enabled
                  - switch.is_on: pump_off
                  - not:
                      and:
                        - switch.is_on: autostop_enabled
                        - binary_sensor.is_on: filtration_quota_reached
                  - lambda: |-
                      auto now = id(ha_time).now();
                      return now.hour == id(autostart_time).hour
                          && now.minute == id(autostart_time).minute;
              then:
                - switch.turn_on: pump_speed1

one_wire:
  - platform: gpio
    pin: 16

sensor:
  - platform: dallas_temp
    name: "Température Eau"
    id: temperature_eau
    accuracy_decimals: 1
    update_interval: 60s

  - platform: dht
    model: DHT22
    pin: 15
    temperature:
      name: "Température extérieure"
      accuracy_decimals: 1
    humidity:
      name: "Humidité extérieure"
      accuracy_decimals: 1
    update_interval: 60s

  - platform: template
    name: "Delai avant Traitement"
    id: traitement_delay_sensor
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: 'return id(traitement_delay_remaining);'

  - platform: template
    name: "Durée Vitesse 1 (aujourd'hui)"
    unit_of_measurement: "min"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(runtime_speed1_min);'

  - platform: template
    name: "Durée Vitesse 2 (aujourd'hui)"
    unit_of_measurement: "min"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(runtime_speed2_min);'

  - platform: template
    name: "Durée Vitesse 3 (aujourd'hui)"
    unit_of_measurement: "min"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(runtime_speed3_min);'

  - platform: template
    name: "Durée de filtration totale (aujourd'hui)"
    id: filtration_total_min
    unit_of_measurement: "min"
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      return id(runtime_speed1_min) + id(runtime_speed2_min) + id(runtime_speed3_min);

  - platform: template
    name: "Durée de filtration cible"
    id: filtration_target_min
    unit_of_measurement: "min"
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      float t = id(temperature_eau).state;
      if (isnan(t)) return {};
      float h = t / 2.0f;
      float maxh = id(filtration_max_hours).state;
      if (!isnan(maxh) && h > maxh) h = maxh;
      return h * 60.0f;

  - platform: template
    name: "Durée de filtration restante"
    id: filtration_remaining_min
    unit_of_measurement: "min"
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      float quota = id(filtration_target_min).state;
      float total = id(filtration_total_min).state;
      if (isnan(quota) || isnan(total)) return {};
      float remaining = quota - total;
      return remaining > 0.0f ? remaining : 0.0f;


binary_sensor:
  - platform: template
    name: "Quota de filtration atteint"
    id: filtration_quota_reached
    lambda: |-
      float remaining = id(filtration_remaining_min).state;
      if (isnan(remaining)) return false;
      return remaining <= 0.0f;
